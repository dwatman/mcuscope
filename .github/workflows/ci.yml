name: CI

on:
  push:
    # Branches only: the Release workflow re-runs tests and lint on the tagged commit
    # (ubuntu, py3.12), and full CI already ran on the branch push of the same commit,
    # so CI on the tag push again is pure duplication.
    branches: ['**']
  pull_request:

# Least privilege: nothing here writes to the repo, and artifact upload is authorised by
# the runner, not by this token. Declared explicitly so a permissive repo/org default
# does not silently hand CI a write-scoped token.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run's verdict irrelevant, and each run
# costs ~5 min across several runners. Cancel the superseded one instead of paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # uv is the documented dev path (CLAUDE.md, README), so CI installs the same way a
      # developer does instead of testing a pip path nobody uses.
      # Full version pin, not @v9: setup-uv stopped publishing moving major/minor tags at
      # v8 on purpose (supply-chain hardening), so @v9 does not resolve and never will.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: host/pyproject.toml

      # Pinned rather than left to whatever the runner image ships: test_webui_js.py skips
      # itself below node 18, so an image that dropped or downgraded node would turn the whole
      # web UI suite into a silent skip. The guard below then proves it did not.
      - name: Set up Node.js (for the web UI JS tests)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up MinGW-w64 (gcc + make, for firmware tests)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Add MinGW-w64 to PATH
        if: runner.os == 'Windows'
        run: echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create virtualenv (host/.venv, as documented)
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install mcuscope (editable, with dev deps)
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run --no-sync python -m ruff check .

      # -rs and the tee'd report exist for the verify steps below: they read this run's
      # own skip report instead of re-running the C and JS suites, which used to double
      # their cost on every job.
      - name: Test (pytest, with coverage)
        shell: bash
        run: uv run --no-sync python -m pytest --cov=mcuscope --cov-report=term-missing -rs | tee pytest-report.txt

      # The sanitizer case skips by design on Windows, where MinGW-w64 ships no ASan
      # runtime; any other skip in the file means gcc/make went missing. One process per
      # guard, no pipe: under bash's pipefail a `grep -q` that exits at its first match
      # kills the producer with SIGPIPE, and the pipeline then reads as "no match".
      - name: Verify firmware C tests actually ran (not silently skipped)
        shell: bash
        run: |
          if awk '/SKIPPED/ && /test_firmware_monitor/ && tolower($0) !~ /asan|sanitizer/ { f = 1 } END { exit !f }' pytest-report.txt; then
            echo "firmware monitor C tests were skipped on ${{ runner.os }} (gcc/make missing?)" >&2
            exit 1
          fi

      - name: Verify web UI JS tests actually ran (not silently skipped)
        shell: bash
        run: |
          if grep -q 'SKIPPED.*test_webui_js' pytest-report.txt; then
            echo "web UI JS tests were skipped on ${{ runner.os }} (node missing or too old?)" >&2
            exit 1
          fi

      # Phase 1's acceptance line is the standalone script over TCP, which nothing in the
      # pytest suite exercises: the tests drive the simulator core in process, not
      # `python tools/mcu_sim.py` and its listener. Runs on both OSes from one script.
      - name: Simulator TCP smoke (python tools/mcu_sim.py, >1 ping)
        run: uv run --no-sync python ../tools/ci_sim_smoke.py

      # The parser is fed untrusted UART bytes, so the C suite is also run under
      # AddressSanitizer + UBSan. Linux only: the MinGW-w64 toolchain has no ASan runtime.
      - name: Firmware C tests under ASan + UBSan
        if: runner.os == 'Linux'
        working-directory: firmware/tests
        run: make asan

  build:
    name: build (wheel + sdist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: host/pyproject.toml

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      # The web UI is package data, not importable code, so nothing in the test suite
      # notices if a build-backend or include-pattern change drops it. A wheel that is
      # missing mcuscope/webui/vendor/uPlot.iife.min.js installs and imports fine and only
      # fails when a user opens the UI - which, without this, would be at publish time.
      - name: Assert package data is present in the built artifacts
        run: python ../tools/check_dist.py artifacts dist --source .

      - name: Check artifact metadata (twine)
        run: uvx twine check dist/*

      # Every other job installs the editable checkout, so nothing ever ran the artifact
      # that actually ships. A wheel that installs but cannot start would be found by a
      # user, and a burned version number on PyPI cannot be reclaimed.
      - name: Install the built wheel and run its console scripts
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheelcheck"
          VIRTUAL_ENV="$RUNNER_TEMP/wheelcheck" uv pip install dist/*.whl
          "$RUNNER_TEMP/wheelcheck/bin/mcuscoped" --version
          "$RUNNER_TEMP/wheelcheck/bin/mcu" --version
          # All three, not two: test_scaffold covers mcu-sim only against the editable
          # install, so a break in its entry point (or its removal from [project.scripts])
          # shipped undetected. --help, because mcu-sim has no --version and its bare form
          # binds a listener.
          "$RUNNER_TEMP/wheelcheck/bin/mcu-sim" --help
          # --version never binds a port: start the daemon through its console script and
          # stop it with the installed CLI.
          python ../tools/check_dist.py serve "$RUNNER_TEMP/wheelcheck/bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcuscope-dist
          path: host/dist/*
          if-no-files-found: error

  # The build job installs and runs the wheel, but only on Linux. Entry points and paths
  # are exactly where Windows differs (Scripts\ vs bin/, .exe wrappers, console-script
  # generation), so the shipped wheel is installed and started on Windows too. Minimal by
  # design: it exists to catch entry-point and path breakage, not to re-run the suite.
  wheel-smoke:
    name: wheel smoke (windows)
    needs: build
    runs-on: windows-latest
    steps:
      # For tools/check_dist.py only; the wheel under test comes from the build job.
      - name: Checkout
        uses: actions/checkout@v7

      # Same version the wheel was built with, so a failure here is about the artifact
      # and not about an interpreter the build never saw.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the built artifacts
        uses: actions/download-artifact@v7
        with:
          name: mcuscope-dist
          path: dist

      - name: Install the wheel into a clean venv and run its console scripts
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist\*.whl)
          if ($wheels.Count -ne 1) { throw "expected exactly 1 wheel in dist/, found $($wheels.Count)" }
          $wheel = $wheels[0].FullName
          # PowerShell does not expand globs for native commands, so the path is resolved
          # here and handed to pip whole.
          $venv = Join-Path $env:RUNNER_TEMP 'wheelcheck'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          $scripts = Join-Path $venv 'Scripts'
          & (Join-Path $scripts 'python.exe') -m pip install --disable-pip-version-check $wheel
          if ($LASTEXITCODE -ne 0) { throw "installing $wheel failed" }
          & (Join-Path $scripts 'mcuscoped.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "mcuscoped --version failed" }
          & (Join-Path $scripts 'mcu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "mcu --version failed" }
          # --help, because mcu-sim has no --version and its bare form binds a listener.
          & (Join-Path $scripts 'mcu-sim.exe') --help
          if ($LASTEXITCODE -ne 0) { throw "mcu-sim --help failed" }
          # Serve through mcuscoped.exe on a throwaway config, stop it with mcu.exe.
          python tools\check_dist.py serve $scripts
          if ($LASTEXITCODE -ne 0) { throw "check_dist serve failed" }

  # The monitor must build for the target, freestanding, and the port template with it;
  # the host gcc builds in `test` cannot show either.
  firmware-arm:
    name: firmware (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile the monitor and the port template for Cortex-M4
        run: make -C firmware/tests arm-check
