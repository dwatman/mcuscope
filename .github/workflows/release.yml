name: Release

# Publishing is deliberately a separate workflow from CI. CI proves the code is good on
# every push; this one only ever runs when a release is actually wanted, because a PyPI
# version number is single-use forever and cannot be reclaimed by deleting the release.
#
# Two ways in:
#   - push a tag "v<version>"  -> builds and publishes to the real PyPI
#   - run it manually          -> defaults to TestPyPI, which is the rehearsal
on:
  push:
    tags: ["v*"]
#
# A manual run is a DRY RUN: it builds and runs every check, then stops without uploading
# anything. That is the rehearsal, and it needs no TestPyPI account. Publishing happens
# only on a tag push, which is what the version-matches-the-tag guard below keys off.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Full version pin, not @v9: setup-uv stopped publishing moving major/minor tags at
      # v8 on purpose (supply-chain hardening), so @v9 does not resolve and never will.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: host/pyproject.toml

      - name: Create virtualenv
        run: uv venv --python 3.12

      - name: Install mcuscope (editable, with dev deps)
        run: uv pip install -e ".[dev]"

      # A tag is the only thing that triggers a real publish, so the one number that must
      # not be wrong is checked before anything is built. __init__.py is the single source
      # of the version (hatchling reads it); the tag is what humans see on GitHub.
      - name: Package version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(uv run --no-sync python -c "import mcuscope; print(mcuscope.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "package=$pkg tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::mcuscope/__init__.py says $pkg but the tag says $tag"
            exit 1
          fi

      # The release notes are this version's CHANGELOG.md section. Extracted and checked
      # HERE, before anything is published: a forgotten changelog roll must fail the build
      # while the version number is still unspent, not after it is irrevocably on PyPI.
      # The version is matched with string comparison, not spliced into a regex, so the
      # dots in it cannot act as wildcards. The section ends at the next "## [" heading
      # or at the link-reference lines at the bottom of the file.
      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            /^## \[/       { on = 0 }
            /^\[[^]]*\]: / { on = 0 }
            on' ../CHANGELOG.md > ../notes.md
          if ! grep -q '[^[:space:]]' ../notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      # Kept separate from release-dist: everything in that artifact is uploaded to PyPI
      # and fed to twine, and notes.md is neither a wheel nor an sdist. Written to the
      # repo root, not host/, so the sdist build cannot sweep it in as source.
      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

      # Publishing untested code is the one mistake that cannot be undone, so the suite
      # runs here too rather than trusting that CI happened to be green on this commit.
      - name: Test
        run: uv run --no-sync python -m pytest -q --no-cov

      - name: Lint
        run: uv run --no-sync python -m ruff check .

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      # The web UI is package data, not importable code, so a wheel missing it installs
      # and imports fine and only fails when a user opens the UI. On PyPI that is
      # unfixable: the version number is spent. CI checks this exhaustively; this is the
      # last-line sentinel check on the artifact actually about to be uploaded.
      - name: Assert the web UI is in the wheel
        run: |
          uv run --no-sync python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")
          if len(wheel) != 1:
              sys.exit(f"expected exactly one wheel, got {wheel}")
          names = set(zipfile.ZipFile(wheel[0]).namelist())
          required = {
              "mcuscope/webui/index.html",
              "mcuscope/webui/app.js",
              "mcuscope/webui/style.css",
              "mcuscope/webui/vendor/uPlot.iife.min.js",
          }
          missing = sorted(required - names)
          if missing:
              sys.exit(f"wheel {wheel[0]} is missing package data: {missing}")
          print(f"{wheel[0]}: web UI present ({len(names)} entries)")
          PY

      - name: Check artifact metadata (twine)
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: host/dist/*
          if-no-files-found: error

  # Everything above runs on ubuntu against an editable install, so the artifact about to
  # be published has never been installed and started on Windows. Entry points and paths
  # are exactly where Windows differs (Scripts\ vs bin/, .exe wrappers), and a wheel that
  # installs but cannot start is unfixable once the version number is spent on PyPI.
  wheel-smoke:
    name: wheel smoke (windows)
    needs: build
    runs-on: windows-latest
    steps:
      # Same version the wheel was built with, so a failure here is about the artifact
      # and not about an interpreter the build never saw.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the built artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist

      - name: Install the wheel into a clean venv and run its console scripts
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist\*.whl)
          if ($wheels.Count -ne 1) { throw "expected exactly 1 wheel in dist/, found $($wheels.Count)" }
          $wheel = $wheels[0].FullName
          # PowerShell does not expand globs for native commands, so the path is resolved
          # here and handed to pip whole.
          $venv = Join-Path $env:RUNNER_TEMP 'wheelcheck'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          $scripts = Join-Path $venv 'Scripts'
          & (Join-Path $scripts 'python.exe') -m pip install --disable-pip-version-check $wheel
          if ($LASTEXITCODE -ne 0) { throw "installing $wheel failed" }
          & (Join-Path $scripts 'mcuscoped.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "mcuscoped --version failed" }
          & (Join-Path $scripts 'mcu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "mcu --version failed" }
          # --help, because mcu-sim has no --version and its bare form binds a listener.
          & (Join-Path $scripts 'mcu-sim.exe') --help
          if ($LASTEXITCODE -ne 0) { throw "mcu-sim --help failed" }

  publish:
    name: publish
    # wheel-smoke gates the upload: the artifact must have started on Windows before the
    # version number is spent.
    needs: [build, wheel-smoke]
    # Dry runs stop here: the build job has already proved the artifacts are good, and a
    # manual run is only ever a rehearsal.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token is stored in this repo. PyPI is configured
    # to trust this repo + workflow + environment, and mints a short-lived credential per
    # run. The environment is also where a required reviewer can be attached, so a tag
    # push cannot publish without a human approving it.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist

  github-release:
    name: github release
    # After publish, so a PyPI failure never leaves a GitHub release pointing at a
    # version that does not exist on the index.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The release body is this version's CHANGELOG.md section, extracted and validated
      # by the build job before anything was published; here it is only downloaded.
      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
