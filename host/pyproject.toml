[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwbridge"
version = "0.1.0"
description = "Host daemon and CLI bridging an AI agent and a human to embedded hardware over serial."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Watman" }]
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
hwbridged = "hwbridge.daemon:main"
mcu = "hwbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hwbridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
