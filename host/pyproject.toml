[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcuscope"
description = "MCUscope: host daemon, CLI and web UI to debug, monitor and plot embedded targets over serial, for humans and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Watman", email = "dwatman@gmail.com" }]
keywords = [
    "mcu", "microcontroller", "embedded", "serial", "uart", "debug",
    "oscilloscope", "plotting", "can", "i2c", "spi", "stm32",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]
# Upper bounds only on the pre-1.0 dependencies. A 0.x release is allowed to break its
# API on a minor bump, and this project leans on internals that have moved before
# (typer's vendored click, starlette's TestClient reached through fastapi), so an
# unbounded `>=` there is a live risk of a green lockfile-free install breaking at
# import time. The post-1.0 deps (pyserial, platformdirs, websockets) follow semver and
# stay uncapped so security fixes land without a release here.
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "typer>=0.12,<1.0",
    "httpx>=0.27,<1.0",
    "platformdirs>=4.0",
    "websockets>=14.0",
    "tomlkit>=0.12,<1.0",
    # Not stdlib `re`: user-supplied patterns from /lines, /wait and /assert are matched
    # with this module's `timeout=` argument, which is the ReDoS backstop. Date-versioned
    # (2024.x), so an upper bound would only pin it to a year for no benefit.
    "regex>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    # Shuffles test order every run. Earns its place: the suite was order-dependent and
    # nothing caught it, because a global left set by one test became an unstated
    # precondition of another - and the test it broke only passed against a value production
    # never has. Dev-only, so it costs a user nothing.
    "pytest-randomly>=3.15",
    "ruff>=0.5",
]

[project.scripts]
mcuscoped = "mcuscope.daemon:console_entry"
mcu = "mcuscope.cli:console_entry"
mcu-sim = "mcuscope.sim:console_entry"

[project.urls]
Homepage = "https://github.com/dwatman/mcuscope"
Repository = "https://github.com/dwatman/mcuscope"
Issues = "https://github.com/dwatman/mcuscope/issues"

[tool.hatch.version]
path = "mcuscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcuscope"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Backstop, not a budget: the slowest test in the suite is ~14 s, so 90 s only ever fires
# on something genuinely wedged (a socket that never reads, a reconnect that never
# settles). Without it such a test hangs CI until the job-level timeout kills it with no
# clue as to where. The `thread` method is the cross-platform one and, unlike SIGALRM,
# reaches a stall inside a background reader thread - it dumps every thread's stack before
# killing the run, which is the whole point.
timeout = 90
timeout_method = "thread"

[tool.coverage.run]
source = ["mcuscope"]

[tool.coverage.report]
# A regression alarm, not a target. Measured total is 87% (cli.py 59%, daemon.py 84%), so 78
# leaves headroom for the platform-specific branches only one OS can ever reach and only
# fires when something genuinely loses coverage. Raise it deliberately as coverage improves;
# do not pin it to whatever today's number happens to be.
#
# The printed figure understates reality, and understates it most for cli.py: the e2e and CLI
# suites drive `mcu` as a real subprocess and that child is not measured. Collected with
# COVERAGE_PROCESS_START, cli.py measures ~85% and the total ~89%. The floor is set against
# the plain number because that is what CI computes.
#
# It was 55 against a real 84 for several rounds, which alerts on nothing: a floor 29 points
# below reality is a floor that cannot fire.
fail_under = 78
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
