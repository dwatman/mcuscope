[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcuscope"
description = "MCUscope: host daemon, CLI and web UI to debug, monitor and plot embedded targets over serial, for humans and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Watman", email = "dwatman@gmail.com" }]
keywords = [
    "mcu", "microcontroller", "embedded", "serial", "uart", "debug",
    "oscilloscope", "plotting", "can", "i2c", "spi", "stm32",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "websockets>=14.0",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[project.scripts]
mcuscoped = "mcuscope.daemon:main"
mcu = "mcuscope.cli:main"
mcu-sim = "mcuscope.sim:main"

[project.urls]
Homepage = "https://github.com/dwatman/mcuscope"
Repository = "https://github.com/dwatman/mcuscope"
Issues = "https://github.com/dwatman/mcuscope/issues"

[tool.hatch.version]
path = "mcuscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcuscope"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Backstop, not a budget: the slowest test in the suite is ~14 s, so 90 s only ever fires
# on something genuinely wedged (a socket that never reads, a reconnect that never
# settles). Without it such a test hangs CI until the job-level timeout kills it with no
# clue as to where. The `thread` method is the cross-platform one and, unlike SIGALRM,
# reaches a stall inside a background reader thread - it dumps every thread's stack before
# killing the run, which is the whole point.
timeout = 90
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
